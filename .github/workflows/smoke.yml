name: Deployment smoke check
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Staging URL including trailing slash and repository subpath'
        required: true
        type: string
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
        env:
          SMOKE_BASE_URL: ${{ inputs.base_url }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deployment-evidence
          path: |
            playwright-report/
            test-results/
