name: Deploy and verify Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Keep deployment and its verification together; never cancel a deployment midway.
concurrency:
  group: pages-deployment
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test:harness
      - run: npx playwright install --with-deps chromium
      - run: npm run verify
      - run: node scripts/deployment.mjs stamp
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pre-deployment-evidence
          path: |
            playwright-report/
            test-results/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy tested artifact
        id: deployment
        uses: actions/deploy-pages@v4

  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SMOKE_BASE_URL: ${{ needs.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Wait for expected deployed commit
        id: identity_before
        run: node scripts/deployment.mjs check
      - name: Exercise deployed user journeys
        id: journeys
        run: npm test -- --reporter=list,html,json
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: playwright-results.json
      - name: Confirm commit remained stable during checks
        id: identity_after
        if: always() && steps.identity_before.outcome == 'success'
        run: node scripts/deployment.mjs check
      - name: Record deployment evidence
        if: always()
        env:
          CHECK_RESULT: ${{ job.status }}
          IDENTITY_BEFORE: ${{ steps.identity_before.outcome }}
          IDENTITY_AFTER: ${{ steps.identity_after.outcome }}
        run: |
          node --input-type=module -e 'import fs from "node:fs"; fs.writeFileSync("deployment-evidence.json", JSON.stringify({sha:process.env.GITHUB_SHA,url:process.env.SMOKE_BASE_URL,result:process.env.CHECK_RESULT,runId:process.env.GITHUB_RUN_ID,runAttempt:process.env.GITHUB_RUN_ATTEMPT,identityBefore:process.env.IDENTITY_BEFORE,identityAfter:process.env.IDENTITY_AFTER},null,2));'
          echo "Deployment checks: $CHECK_RESULT" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "URL: $SMOKE_BASE_URL" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deployed-smoke-evidence
          path: |
            deployment-evidence.json
            playwright-results.json
            playwright-report/
            test-results/
          retention-days: 7

  report_failure:
    needs: [deploy, smoke]
    if: always() && needs.smoke.result == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: deployed-smoke-evidence
          path: incident-evidence
      - name: Create or update the demo ClickUp incident
        env:
          CLICKUP_TOKEN: ${{ secrets.CLICKUP_TOKEN }}
        run: python3 harness/incidents.py --evidence incident-evidence/deployment-evidence.json --report incident-evidence/playwright-results.json --send
